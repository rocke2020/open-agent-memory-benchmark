# One complete v0.1 LME-60 comparison. Secrets are referenced by environment-variable
# name only; this file never contains credential or endpoint values.
comparison: v0.1-lme60

dataset:
  dataset_id: longmemeval-s-cleaned
  workload_id: lme60-balanced-v1
  selection: lme60
  path: datasets/longmemeval-cleaned/longmemeval_s_cleaned.json
  revision: 98d7416c24c778c2fee6e6f3006e7a073259d48f
  source_sha256: d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442
  case_manifest_hash: 90b2669f7b893e59d404549f5803882bcd6640ce82520a9bf09672cc79464c80

cells:
  - cell_id: hindsight-lme60
    provider_id: hindsight
    adapter_profile_id: hindsight-rest-v1
    endpoint_variable: OAMB_HINDSIGHT_BASE_URL
    credential_variable: not_applicable
    recipient: local-hindsight-service
    producer_role: hindsight_extraction
    embedding_role: embedding
    answer_role: answer
    judge_role: judge
    retrieval_binding: hindsight
  - cell_id: mem0-lme60
    provider_id: mem0
    adapter_profile_id: mem0-rest-v1
    endpoint_variable: OAMB_MEM0_BASE_URL
    credential_variable: OAMB_MEM0_ADMIN_API_KEY
    recipient: local-mem0-service
    producer_role: mem0_extraction
    embedding_role: embedding
    answer_role: answer
    judge_role: judge
    retrieval_binding: mem0
  - cell_id: openviking-lme60
    provider_id: openviking
    adapter_profile_id: openviking-session-rest-v1
    endpoint_variable: OAMB_OPENVIKING_BASE_URL
    credential_variable: OAMB_OPENVIKING_USER_API_KEY
    recipient: local-openviking-service
    producer_role: openviking_semantic_understanding
    embedding_role: embedding
    answer_role: answer
    judge_role: judge
    retrieval_binding: openviking

llm_profiles:
  light_model: &light_model deepseek-v4-flash
  deep_model: &deep_model deepseek-v4-pro

models:
  # DeepSeek scale is low < high < max. Low is enabled thinking at rank 1/3.
  # Every generative role uses the one generic LLM connection from root .env.
  # Provider-owned producer roles use Flash/low to reduce latency and tokens.
  hindsight_extraction:
    model: *light_model
    thinking_effort: low
    endpoint_variable: LLM_BASE_URL
    credential_variable: LLM_API_KEY
    recipient: llm-api
    execution_owner: provider_internal
    proof_kind: effective_config_and_outbound_request
    proof_reference: reasoning_effort=low
    usage_coverage: classified
  mem0_extraction:
    model: *light_model
    thinking_effort: low
    endpoint_variable: LLM_BASE_URL
    credential_variable: LLM_API_KEY
    recipient: llm-api
    execution_owner: provider_internal
    proof_kind: effective_config_and_outbound_request
    proof_reference: reasoning_effort=low
    usage_coverage: classified
  openviking_semantic_understanding:
    model: *light_model
    thinking_effort: low
    endpoint_variable: LLM_BASE_URL
    credential_variable: LLM_API_KEY
    recipient: llm-api
    execution_owner: provider_internal
    proof_kind: effective_config_and_outbound_request
    proof_reference: reasoning_effort=low
    usage_coverage: classified
  answer:
    model: *deep_model
    thinking_effort: low
    endpoint_variable: LLM_BASE_URL
    credential_variable: LLM_API_KEY
    recipient: llm-api
    execution_owner: harness
    proof_kind: sealed_outbound_request_and_response
    proof_reference: reasoning_effort=low
    usage_coverage: classified
  # High is the middle rank 2/3, not maximum. It is reserved for offline judging.
  judge:
    model: *light_model
    thinking_effort: high
    endpoint_variable: LLM_BASE_URL
    credential_variable: LLM_API_KEY
    recipient: llm-api
    execution_owner: harness
    proof_kind: sealed_outbound_request_and_response
    proof_reference: reasoning_effort=high
    usage_coverage: classified
  # Embedding is non-generative; thinking and credentials do not apply.
  embedding:
    model: qwen3-embedding:0.6b
    thinking_effort: not_applicable
    endpoint_variable: OAMB_EMBEDDING_BASE_URL
    credential_variable: not_applicable
    recipient: local-vllm-metal
    execution_owner: provider_internal
    proof_kind: model_dimension_probe
    proof_reference: not_applicable
    usage_coverage: classified

retrieval:
  generation: disabled
  bindings:
    - binding_id: hindsight
      provider_id: hindsight
      route: recall
      query_embedding_role: embedding
      disabled_feature: reflect
      disabled_value: absent
      request_constraint: omit_reflect
      proof_kind: complete_outbound_trace
    - binding_id: mem0
      provider_id: mem0
      route: /search
      query_embedding_role: embedding
      disabled_feature: native_reranking
      disabled_value: disabled
      request_constraint: rerank_field_absent_by_schema
      proof_kind: effective_config_and_complete_outbound_trace
    - binding_id: openviking
      provider_id: openviking
      route: /api/v1/search/find
      query_embedding_role: embedding
      disabled_feature: session_intent
      disabled_value: not_applicable
      request_constraint: no_session_id_on_find
      proof_kind: source_verified_endpoint_and_complete_outbound_trace

execution:
  # Each eligible operation owns its own retry count; zero means one initial call.
  max_retries_per_operation: 2
  # Covers one external attempt, including provider task polling.
  operation_timeout_seconds: 900

decision:
  minimum_accuracy_delta: "0.05"
  maximum_exact_mcnemar_p_value: "0.05"
