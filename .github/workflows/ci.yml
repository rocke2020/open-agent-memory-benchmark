name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-package:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups

      - name: Static checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src tests

      - name: Full credential-free test suite
        run: uv run pytest -q

      - name: Provider-service offline tests
        run: |
          python3 -m unittest discover -s provider-services/tests -p 'test_*.py' -v

      - name: Public boundary
        run: uv run python scripts/check_public_boundary.py

      - name: Build distributions
        run: uv build

      - name: Tracked tree remains unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
