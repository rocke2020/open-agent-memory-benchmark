name: ${OAMB_PROVIDER_PROJECT:?set OAMB_PROVIDER_PROJECT in root .env}

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight-api:0.9.2-slim@sha256:7635a15739361dbdf221ba796ad25a813f876144fe113022eea8e26cb6ee75e7
    shm_size: 1gb
    ports:
      - "127.0.0.1:${OAMB_HINDSIGHT_PORT:-18888}:8888"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${OAMB_HINDSIGHT_LLM_PROVIDER:?required}
      HINDSIGHT_API_LLM_MODEL: ${OAMB_HINDSIGHT_LLM_MODEL:?required}
      HINDSIGHT_API_LLM_BASE_URL: ${OAMB_HINDSIGHT_LLM_BASE_URL:?required}
      HINDSIGHT_API_LLM_API_KEY: ${OAMB_HINDSIGHT_LLM_API_KEY:?required}
      HINDSIGHT_API_LLM_REASONING_EFFORT: ${OAMB_HINDSIGHT_LLM_REASONING_EFFORT:?required}
      OAMB_EXTRACTION_MAX_RETRIES: ${OAMB_EXTRACTION_MAX_RETRIES:?required}
      HINDSIGHT_API_LLM_MAX_RETRIES: "0"
      HINDSIGHT_API_RETAIN_LLM_MAX_RETRIES: ${OAMB_EXTRACTION_MAX_RETRIES:?required}
      HINDSIGHT_API_WORKER_MAX_RETRIES: "0"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: ${OAMB_EMBEDDING_BASE_URL:?required}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${OAMB_EMBEDDING_API_KEY:?required}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ${OAMB_EMBEDDING_MODEL:?required}
      HINDSIGHT_API_ENABLE_RERANKING: "false"
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: "true"
      NO_PROXY: ${OAMB_LLM_NO_PROXY:?required}
      no_proxy: ${OAMB_LLM_NO_PROXY:?required}
      HINDSIGHT_API_WORKER_ID: oamb-hindsight-v0-9-2
      PYTHONPATH: /opt/oamb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hindsight_pg0:/home/hindsight/.pg0
      - ./retry-guard/sitecustomize.py:/opt/oamb/sitecustomize.py:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--connect-timeout", "3", "--max-time", "5", "http://127.0.0.1:8888/health/live"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
    stop_grace_period: 30s

  mem0-postgres:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: oamb_mem0
      POSTGRES_PASSWORD: ${OAMB_MEM0_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: postgres
    volumes:
      - mem0_postgres:/var/lib/postgresql/data
      - ./mem0/init-db.sh:/docker-entrypoint-initdb.d/10-oamb-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d postgres -U oamb_mem0 && pg_isready -q -d mem0_app -U oamb_mem0"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s

  mem0:
    image: oamb/mem0-api:2.0.19-dc82354
    build:
      context: .
      dockerfile: mem0/Dockerfile
    ports:
      - "127.0.0.1:${OAMB_MEM0_PORT:-18889}:8000"
    environment:
      POSTGRES_HOST: mem0-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: oamb_mem0
      POSTGRES_PASSWORD: ${OAMB_MEM0_POSTGRES_PASSWORD:?required}
      APP_DB_NAME: mem0_app
      ADMIN_API_KEY: ${OAMB_MEM0_ADMIN_API_KEY:?required}
      JWT_SECRET: ${OAMB_MEM0_JWT_SECRET:?required}
      AUTH_DISABLED: "false"
      MEM0_TELEMETRY: "false"
      HISTORY_DB_PATH: /app/history/history.db
      OPENAI_API_KEY: ${OAMB_MEM0_LLM_API_KEY:?required}
      MEM0_DEFAULT_LLM_MODEL: ${OAMB_MEM0_LLM_MODEL:?required}
      OAMB_MEM0_LLM_BASE_URL: ${OAMB_MEM0_LLM_BASE_URL:?required}
      OAMB_EXTRACTION_MAX_RETRIES: ${OAMB_EXTRACTION_MAX_RETRIES:?required}
      MEM0_DEFAULT_EMBEDDER_MODEL: ${OAMB_EMBEDDING_MODEL:?required}
      NO_PROXY: ${OAMB_LLM_NO_PROXY:?required}
      no_proxy: ${OAMB_LLM_NO_PROXY:?required}
      PYTHONPATH: /opt/oamb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mem0_history:/app/history
      - ./retry-guard/sitecustomize.py:/opt/oamb/sitecustomize.py:ro
    depends_on:
      mem0-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)); assert '/memories' in d['paths'] and '/search' in d['paths']"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
    stop_grace_period: 30s

  mem0-inspector:
    image: oamb/mem0-api:2.0.19-dc82354
    command: ["python", "/opt/oamb/inspector.py"]
    ports:
      - "127.0.0.1:${OAMB_MEM0_INSPECTOR_PORT:-16333}:6333"
    environment:
      OAMB_INSPECTOR_LISTEN_HOST: 0.0.0.0
      OAMB_INSPECTOR_LISTEN_PORT: "6333"
      OAMB_MEM0_INSPECTOR_API_KEY: ${OAMB_MEM0_INSPECTOR_API_KEY:?required}
      POSTGRES_HOST: mem0-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: oamb_mem0
      POSTGRES_PASSWORD: ${OAMB_MEM0_POSTGRES_PASSWORD:?required}
    depends_on:
      mem0-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:6333/health',headers={'Authorization':'Bearer '+os.environ['OAMB_MEM0_INSPECTOR_API_KEY']}); assert urllib.request.urlopen(r,timeout=5).status == 200"]
      interval: 10s
      timeout: 6s
      retries: 20
    stop_grace_period: 15s

  openviking:
    image: ghcr.io/volcengine/openviking:v0.4.16@sha256:46f9e34cd37238c28cbd9535033773d179006bdf7f3e528dd1c46567abce7701
    ports:
      - "127.0.0.1:${OAMB_OPENVIKING_PORT:-19330}:1933"
    environment:
      OPENVIKING_WITH_BOT: "0"
      OPENVIKING_CONFIG_FILE: /etc/openviking/ov.conf
      OPENVIKING_SERVER_HOST: 0.0.0.0
      OAMB_EMBEDDING_BASE_URL: ${OAMB_EMBEDDING_BASE_URL:?required}
      OAMB_EMBEDDING_API_KEY: ${OAMB_EMBEDDING_API_KEY:?required}
      OAMB_EMBEDDING_MODEL: ${OAMB_EMBEDDING_MODEL:?required}
      OAMB_OPENVIKING_VLM_PROVIDER: ${OAMB_OPENVIKING_VLM_PROVIDER:?required}
      OAMB_OPENVIKING_VLM_MODEL: ${OAMB_OPENVIKING_VLM_MODEL:?required}
      OAMB_OPENVIKING_VLM_REASONING_EFFORT: ${OAMB_OPENVIKING_VLM_REASONING_EFFORT:?required}
      OAMB_OPENVIKING_VLM_BASE_URL: ${OAMB_OPENVIKING_VLM_BASE_URL:?required}
      OAMB_OPENVIKING_VLM_API_KEY: ${OAMB_OPENVIKING_VLM_API_KEY:?required}
      OAMB_EXTRACTION_MAX_RETRIES: ${OAMB_EXTRACTION_MAX_RETRIES:?required}
      OAMB_OPENVIKING_ROOT_API_KEY: ${OAMB_OPENVIKING_ROOT_API_KEY:?required}
      NO_PROXY: ${OAMB_LLM_NO_PROXY:?required}
      no_proxy: ${OAMB_LLM_NO_PROXY:?required}
      PYTHONPATH: /opt/oamb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./openviking/ov.conf:/etc/openviking/ov.conf:ro
      - ./retry-guard/sitecustomize.py:/opt/oamb/sitecustomize.py:ro
      - openviking_workspace:/var/lib/openviking
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s

  openviking-storage-probe:
    profiles: ["verification"]
    image: ghcr.io/volcengine/openviking:v0.4.16@sha256:46f9e34cd37238c28cbd9535033773d179006bdf7f3e528dd1c46567abce7701
    entrypoint: ["python", "/opt/oamb/storage_probe.py"]
    command: []
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      OAMB_OPENVIKING_WORKSPACE: /probe/workspace
    volumes:
      - ./openviking/storage_probe.py:/opt/oamb/storage_probe.py:ro
      - type: volume
        source: openviking_workspace
        target: /probe/workspace
        read_only: true

volumes:
  hindsight_pg0:
  mem0_postgres:
  mem0_history:
  openviking_workspace:
