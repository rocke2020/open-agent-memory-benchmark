{
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "root_api_key": "${OAMB_OPENVIKING_ROOT_API_KEY}",
    "auth_mode": "api_key"
  },
  "storage": {
    "workspace": "/var/lib/openviking",
    "vectordb": {
      "name": "context",
      "backend": "local",
      "project": "oamb"
    },
    "agfs": {
      "backend": "local",
      "timeout": 10,
      "pathlock": {
        "provider": "filesystem",
        "lock_expire_secs": 30.0
      }
    }
  },
  "embedding": {
    "dense": {
      "provider": "ollama",
      "model": "${OAMB_EMBEDDING_MODEL}",
      "api_base": "${OAMB_OLLAMA_BASE_URL}",
      "dimension": 1024,
      "input": "text"
    },
    "text_source": "content_only",
    "max_input_tokens": 4096
  },
  "vlm": {
    "provider": "${OAMB_OPENVIKING_VLM_PROVIDER}",
    "model": "${OAMB_OPENVIKING_VLM_MODEL}",
    "api_base": "${OAMB_OPENVIKING_VLM_BASE_URL}",
    "api_key": "${OAMB_OPENVIKING_VLM_API_KEY}",
    "temperature": 0.0,
    "max_retries": 2
  },
  "memory": {
    "version": "v2",
    "extraction_enabled": true,
    "session_skill_extraction_enabled": false
  }
}
