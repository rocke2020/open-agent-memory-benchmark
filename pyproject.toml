[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "open-agent-memory-benchmark"
version = "0.1.0"
description = "Evidence-first reproducible benchmark for self-hosted agent-memory systems"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "OAMB contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  # T3: strict immutable contracts and deterministic JSON Schema generation.
  "pydantic>=2.12,<3",
  # T3: the offline CLI composition root and schema build/check commands.
  "typer>=0.20,<1",
  # T6: original REST transports, including OpenAI-compatible model calls.
  "httpx>=0.28,<1",
  # T6: protocol-frozen o200k_base encode_ordinary context accounting.
  "tiktoken==0.14.0",
  # T6: direct, schema-preserving reads of pinned MemoryAgentBench Parquet files.
  "pyarrow>=19,<24",
  # T8: public-key-only Ed25519 verification for detached human decisions.
  "cryptography>=46,<47",
]

[project.optional-dependencies]
# Comparison-ineligible Mem0 SDK profile; imported only after explicit selection.
mem0-sdk = ["mem0ai==2.0.19"]

[project.scripts]
oamb = "oamb.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.140,<7",
  "mypy>=1.18,<2",
  # T8: exact-engine file:// browser/security acceptance without a runtime dependency.
  "playwright==1.55.0",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]
download = [
  "httpx[socks]>=0.28,<1",
  "huggingface-hub>=1.29,<2",
]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/CLAUDE.md",
  "/DATASETS.md",
  "/LICENSE",
  "/prompt-packs",
  "/README.md",
  "/SECURITY.md",
  "/THIRD_PARTY.md",
  "/pyproject.toml",
  "/schemas",
  "/scripts/download",
  "/src",
  "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oamb"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "oamb/schemas"
"prompt-packs" = "oamb/prompt-packs"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["provider-services"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_any_generics = false
