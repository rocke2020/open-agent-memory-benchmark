# OAMB runs from the checkout; uv manages dependencies without a distribution.
[dependency-groups]
runtime = [
  # Strict immutable runtime contracts and fail-closed version dispatch.
  "pydantic>=2.12,<3",
  # Strict duplicate-aware loading of the benchmark's closed YAML shape.
  "pyyaml>=6.0.3,<7",
  # The offline CLI composition root.
  "typer>=0.20,<1",
  # T6: original REST transports, including OpenAI-compatible model calls.
  "httpx>=0.28,<1",
  # T6: protocol-frozen o200k_base encode_ordinary context accounting.
  "tiktoken==0.14.0",
  # Schema-preserving reads of the pinned BEAM-10M Parquet download shards.
  "pyarrow>=19,<24",
]

dev = [
  "hypothesis>=6.140,<7",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]
download = [
  "httpx[socks]>=0.28,<1",
  "huggingface-hub>=1.29,<2",
]

# Comparison-ineligible Mem0 SDK profile; selected with --group mem0-sdk.
mem0-sdk = ["mem0ai==2.0.19"]

[tool.uv]
default-groups = ["runtime", "dev"]

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["provider-services"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_any_generics = false
